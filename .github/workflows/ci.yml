name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        id: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install Dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: Check Format
        id: format-check
        run: bun run format:check

      - name: Lint
        id: lint
        run: bun run lint

      - name: Test
        id: test
        run: bun run test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest
    # Run only on PRs from the same repository as this job depends on secrets
    if: github.repository == github.event.pull_request.head.repo.full_name
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Test Local Action
        id: test-action
        uses: ./
        env:
          ENVIRONMENT: development
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          compare_branch: new_branch
          base_branch: main

      - name: Print
        id: output
        run: |
          echo "diff: ${STEPS_TEST_ACTION_OUTPUTS_DIFF}"
          echo "comment_url: ${STEPS_TEST_ACTION_OUTPUTS_COMMENT_URL}"
        env:
          STEPS_TEST_ACTION_OUTPUTS_DIFF: ${{ steps.test-action.outputs.diff }}
          STEPS_TEST_ACTION_OUTPUTS_COMMENT_URL:
            ${{ steps.test-action.outputs.comment_url }}
